workflows:
  ios-build-workflow:
    name: FM Parking iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Install and add iOS
        script: npm install && npx cap add ios && npx cap sync ios
      - name: Add Microphone Permission
        script: /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string FM pasif radar ve ses spektrumu analizi icin mikrofon erisimi gereklidir." ios/App/App/Info.plist
      - name: Build Unsigned iOS App
        script: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=$CM_BUILD_DIR/build
    artifacts:
      - build/*.app
